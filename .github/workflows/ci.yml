name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, size and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: dist/ is the build of src/
        run: |
          npm run build
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is not the build of src/. Run npm run build and commit dist/."
            exit 1
          fi
      - name: Size budget, one version everywhere, publint
        run: npm run check
      - name: npm pack --dry-run
        run: npm pack --dry-run

  test:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
